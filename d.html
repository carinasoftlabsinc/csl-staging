  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      /* box-sizing:border-box; */
    }

    html,
    body {
      height: 100%;
      font-family: Helvetica, sans-serif;
      font-size: 1em;
      background-color: #212121;
      color: #fafafa;
    }

    .content {
      width: 100%;
      height: 100%;
      font-size: 2em;
      text-align: center;
    }

    .box {
      position: absolute;
      top: 20%;
      bottom: 20%;
      left: 20%;
      right: 20%;
      background-color: rgba(0, 0, 0, 0.3);
    }

    .border-pattern {
      border: 0px solid transparent;
      .bi();
      transition: border-width 0.5s ease-in, padding 0.5s ease-in;
      padding: 100px;

      &:hover {
        border: 20px solid transparent;
        .bi();
        transition: border-width 0.2s ease-out, padding 0.2s ease-out;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
        padding: 80px;
      }
    }
