<div class="auth-container">
  <div class="row auth-main">
    <!-- <div class="col-md-6 px-0 d-none d-md-block">
      <div class="left-img">
        <img src="assets/images/bg.jpg">
      </div>
    </div> -->
    <div class="col-md-12 auth-form-section">
      <div class="form-section">
        <mat-card class="custom-card mat-elevation-z4">
        <div class="auth-wrapper">
         
          <div class="logo-container">
            <img src="assets/images/pages/imgpsh_fullsize_anim.png" width="80" class="rounded-logo">
          </div>
          <p class="welcome-msg"> Welcome to Carina Softlabs </p>
          <!-- <p class="auth-signup-text text-muted"></p>
          <h2 class="login-title color-transition-box">Sign in</h2> -->
          <form class="validate-form" [formGroup]="authForm" (ngSubmit)="onSubmit()">
            <div class="row">
              <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Email</mat-label>
                  <input matInput formControlName="email" />
                  <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>email</mat-icon>
                  <mat-error *ngIf="authForm.get('email')?.hasError('required')">
                    Email is required
                  </mat-error>
                </mat-form-field>
              </div>
            </div>
            <div class="row">
              <div class="col-xl-12col-lg-12 col-md-12 col-sm-12 mb-2">
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Password</mat-label>
                  <input matInput [type]="hide ? 'password' : 'text'" formControlName="password">
                  <a href="#" onClick="return false;" matSuffix (click)="hide = !hide"
                    [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide">
                    <mat-icon class="material-icons-two-tone color-icon m-3" matSuffix>
                      {{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
                  </a>
                  <mat-error *ngIf="authForm.get('password')?.hasError('required')">
                    Password is required
                  </mat-error>
                </mat-form-field>
              </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-2">
              <div class="form-check">
                <!-- <label class="form-check-label">
                  <input class="form-check-input" type="checkbox" value=""> Remember me
                  <span class="form-check-sign">
                    <span class="check"></span>
                  </span>
                </label> -->
              </div>
            </div>
            <div *ngIf="error" class="alert alert-danger mt-3 mb-0">{{error}}</div>
            <div class="container-auth-form-btn">
              <div style="text-align:center">
                <button mat-raised-button color="primary" [class.auth-spinner]="loading" [disabled]="loading"
                  class="auth-form-btn" [disabled]="!authForm.valid " type="submit">Login</button>
              </div>
            </div>
          </form>

        </div>
        </mat-card> 
      </div>
    </div>

  </div>
</div>
