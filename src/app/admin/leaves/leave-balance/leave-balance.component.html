<section class="content">

  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb [title]="'Leave Balance'" [items]="['Employees']" [active_item]="'All Leave Balance'">
      </app-breadcrumb>
    </div>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="materialTableHeader">
            <div class="left">
              <ul class="header-buttons-left ms-0">
                <li class="tbl-title">
                  <h2>Paid Leaves</h2>
                </li>
                <li class="tbl-search-box">
                  <label for="search-input"><i class="material-icons search-icon">search</i></label>
                  <input type="text" class="browser-default search-field" [formControl]="searchInputControl"
                    [matAutocomplete]="auto" placeholder="Search..." #searchInput>
                  <!-- Add the matAutocompleteTrigger and set its input property -->
                  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="onEmployeeSelected($event)">
                    <mat-option *ngFor="let employee of filteredEmployees | async" [value]="employee.name">
                      {{ employee.name | titlecase}}
                    </mat-option>
                  </mat-autocomplete>
                  <button mat-button color="warn" matTooltip="Reset" (click)="clearSearch()">
                    <mat-icon style="font-size: 21px">restart_alt</mat-icon>
                  </button>
                </li>
              </ul>
            </div>
          </div>

          <div class="body overflow-auto">
            <mat-spinner [diameter]="30" *ngIf="isLoading"></mat-spinner>
            <div class="responsive_table" *ngIf="data !== undefined && !isLoading">

              <!-- <table mat-table [dataSource]="data" matSort (matSortChange)="onSortChange($event)" class="mat-cell"> -->
                <table mat-table [dataSource]="data" matSort class="mat-cell">
                <!-- Column definitions -->
                <ng-container matColumnDef="employeeName">
                  <th mat-header-cell *matHeaderCellDef >Name</th>
                  <td mat-cell *matCellDef="let item">{{ item.employeeName | titlecase }}</td>
                </ng-container>
                <ng-container matColumnDef="casualLeave">
                  <th mat-header-cell *matHeaderCellDef>Casual</th>
                  <td mat-cell *matCellDef="let item">{{ item.casualLeave }}</td>
                </ng-container>

                <ng-container matColumnDef="personalLeave">
                  <th mat-header-cell *matHeaderCellDef>Personal</th>
                  <td mat-cell *matCellDef="let item">{{ item.personalLeave }}</td>
                </ng-container>

                <ng-container matColumnDef="medicalLeave">
                  <th mat-header-cell *matHeaderCellDef>Medical</th>
                  <td mat-cell *matCellDef="let item">{{ item.medicalLeave }}</td>
                </ng-container>

                <ng-container matColumnDef="maternityLeave">
                  <th mat-header-cell *matHeaderCellDef>Maternity</th>
                  <td mat-cell *matCellDef="let item">{{ item.maternityLeave }}</td>
                </ng-container>

                <ng-container matColumnDef="LWP">
                  <th mat-header-cell *matHeaderCellDef>LWP</th>
                  <td mat-cell *matCellDef="let item">{{ item.LWP }}</td>
                </ng-container>
                
                

                <ng-container matColumnDef="actions">
                  <th mat-header-cell
                    class="psl-3 tbl-col-width-per-10"
                    *matHeaderCellDef
                  >
                    Actions
                </th>
                  <td mat-cell
                    *matCellDef="let row; let i = index"
                    class="psl-3 tbl-col-width-per-10"
                  >
                    <button
                      mat-icon-button
                      [matMenuTriggerFor]="menu"
                      (click)="$event.stopPropagation()"
                    >
                      <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                      <button
                        mat-menu-item
                        matTooltip="Edit"
                        (click)="openEditDialog(row)"
                      >
                        <mat-icon
                          class="material-icons-two-tone align-middle msr-2"
                          >edit</mat-icon
                        >
                        <span>Update paid leave</span>
                      </button>
                    </mat-menu>
                  </td>
                </ng-container>

                <!-- Table rows -->
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let item; columns: displayedColumns"></tr>
              </table>
            </div>
            <div *ngIf="data.length === 0 && !isLoading" class="not-found-message">No results found.</div>
          </div>
          
          <mat-paginator [length]="totalCount" [pageSize]="limit" (page)="onPageChange($event)"></mat-paginator>
        </div>

      </div>
    </div>
  </div>
</section>
