<section class="content">
  <div class="content-block">
    <div class="block-header">
      <!-- breadcrumb -->
      <app-breadcrumb
        [title]="'All Employees'"
        [items]="['Employees']"
        [active_item]="'All Employees'"
      >
      </app-breadcrumb>
    </div>
    <div class="row">
      <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
        <div class="card">
          <div class="materialTableHeader">
            <div class="left">
              <ul class="header-buttons-left ms-0">
                <li class="tbl-title">
                  <h2>Employees</h2>
                </li>
                <li class="tbl-search-box">
                  <label for="search-input"
                    ><i class="material-icons search-icon">search</i></label
                  >
                  <input
                    type="text"
                    class="browser-default search-field"
                    [(ngModel)]="filter"
                    (input)="onFilterChange(filter)"
                    placeholder="Filter by name"
                  />
                  <button
                    mat-button
                    color="warn"
                    matTooltip="Reset"
                    (click)="clearFilter()"
                  >
                    <mat-icon style="font-size: 21px">restart_alt</mat-icon>
                  </button>
                </li>
              </ul>
            </div>
            <div class="right">
              <ul class="tbl-export-btn">
                <li class="tbl-header-btn">
                  <div class="m-l-10" matTooltip="ADD">
                    <button
                      routerLink="/admin/employees/add-employee"
                      mat-mini-fab
                      color="primary"
                    >
                      <mat-icon class="col-white">add</mat-icon>
                    </button>
                  </div>
                </li>
                <li>
                  <div class="export-button m-l-10" matTooltip="XLSX">
                    <img
                      src="assets/images/icons/xlsx.png"
                      alt=""
                      (click)="exportExcel()"
                    />
                  </div>
                </li>
              </ul>
            </div>
          </div>

          <div class="body overflow-auto">
            <mat-spinner [diameter]="30" *ngIf="isLoading"></mat-spinner>
            <div
              class="responsive_table"
              *ngIf="data !== undefined && !isLoading"
            >
              <!-- <table mat-table [dataSource]="data" matSort (matSortChange)="onSortChange($event)" class="mat-cell"> -->
              <table mat-table [dataSource]="data" matSort class="mat-cell">
                <!-- Column definitions -->
                <ng-container matColumnDef="name">
                  <th mat-header-cell *matHeaderCellDef>Name</th>
                  <td mat-cell *matCellDef="let item">
                    {{ item.name | titlecase }}
                  </td>
                </ng-container>
                <ng-container matColumnDef="email">
                  <th mat-header-cell *matHeaderCellDef>Email</th>
                  <td mat-cell *matCellDef="let item">{{ item.email }}</td>
                </ng-container>

                <ng-container matColumnDef="date">
                  <th mat-header-cell *matHeaderCellDef>
                    Joining Date
                  </th>
                  <td mat-cell *matCellDef="let row">
                    {{ row.joinDate | date : "dd/MM/yyyy" }}
                  </td>
                </ng-container>

                <ng-container matColumnDef="addedBy">
                  <th mat-header-cell *matHeaderCellDef>
                    Added By
                  </th>
                  <td mat-cell *matCellDef="let row">
                    {{ row.addedBy | titlecase }}
                  </td>
                </ng-container>

                <ng-container matColumnDef="shifts">
                  <th mat-header-cell *matHeaderCellDef>
                    Shifts
                  </th>
                  <td mat-cell *matCellDef="let row">
                    <div *ngIf="row.shifts === 'General'">
                      <span class="badge badge-pill badge-primary col-purple"
                        >General</span
                      >
                    </div>
                    <div *ngIf="row.shifts === 'Morning'">
                      <span class="badge badge-pill badge-primary col-black"
                        >Morning</span
                      >
                    </div>

                    <div *ngIf="row.shifts === 'Evening'">
                      <span class="badge badge-pill badge-primary col-red"
                        >Evening</span
                      >
                    </div>
                  </td>
                </ng-container>

                <ng-container matColumnDef="active">
                  <th mat-header-cell *matHeaderCellDef>
                    Status
                  </th>
                  <td mat-cell *matCellDef="let row">
                    <div *ngIf="row.active === true">
                      <span class="badge badge-pill badge-primary col-green"
                        >Active</span
                      >
                    </div>
                    <div *ngIf="row.active === false">
                      <span class="badge badge-pill badge-primary col-red"
                        >Deactive</span
                      >
                    </div>
                  </td>
                </ng-container>

                <ng-container matColumnDef="isProbation">
                  <th mat-header-cell *matHeaderCellDef>
                    Probation
                  </th>
                  <td mat-cell *matCellDef="let row">
                    <div *ngIf="row.isProbation === true">
                      <span class="badge badge-pill badge-primary col-green"
                        >Yes</span
                      >
                    </div>
                    <div *ngIf="row.isProbation === false">
                      <span class="badge badge-pill badge-primary col-red"
                        >No</span
                      >
                    </div>
                  </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                  <th
                    mat-header-cell
                    class="psl-3 tbl-col-width-per-10"
                    *matHeaderCellDef
                  >
                    Actions
                  </th>
                  <td
                    mat-cell
                    *matCellDef="let row; let i = index"
                    class="psl-3 tbl-col-width-per-10"
                  >
                    <button
                      mat-icon-button
                      [matMenuTriggerFor]="menu"
                      (click)="$event.stopPropagation()"
                    >
                      <mat-icon>more_vert</mat-icon>
                    </button>
                    <mat-menu #menu="matMenu">
                      <button
                        mat-menu-item
                        [routerLink]="[
                          '/admin/employees/edit-employee',
                          row._id
                        ]"
                        matTooltip="Edit"
                      >
                        <mat-icon
                          class="material-icons-two-tone align-middle msr-2"
                          >edit</mat-icon
                        >
                        <span>Edit Request</span>
                      </button>
                      <button
                        mat-menu-item
                        (click)="Delete(row)"
                        matTooltip="Delete"
                      >
                        <mat-icon
                          class="material-icons-two-tone align-middle msr-2"
                          >delete</mat-icon
                        >
                        <span>Delete Request</span>
                      </button>
                      <!-- mat-menu-item
                      *ngIf="row.isProbation === true"
                      (click)="Probation(row)"
                      matTooltip="Probation" -->
                      <button
                        mat-menu-item
                        (click)="Probation(row)"
                        matTooltip="Probation"
                      >
                        <mat-icon
                          class="material-icons-two-tone align-middle msr-2"
                          >person_add</mat-icon
                        >
                        <span>Probation Request</span>
                      </button>
                    </mat-menu>
                  </td>
                </ng-container>

                <!-- Table rows -->
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr
                  mat-row
                  *matRowDef="let item; columns: displayedColumns"
                ></tr>
              </table>
            </div>
            <div
              *ngIf="data.length === 0 && !isLoading"
              class="not-found-message"
            >
              No results found.
            </div>
          </div>
          <mat-paginator
            [length]="totalCount"
            [pageSize]="limit"
            (page)="onPageChange($event)"
          ></mat-paginator>
        </div>
      </div>
    </div>
  </div>
</section>
