<!-- navigation="true"
navigation-prev-el=".custom-prev"
navigation-next-el=".custom-next" -->

<div class="">
  <swiper-container
    #swiperContainer
    loop="true"
    autoplay="true"
    effect="coverflow"
    grab-cursor="true"
    centered-slides="true"
    slides-per-view="auto"
    initial-slide="2"
    coverflow-effect-rotate="0"
    coverflow-effect-stretch="0"
    coverflow-effect-depth="250"
    coverflow-effect-modifier="5"
    coverflow-effect-slide-shadows="true"
    pagination="false"

    class="mySwiper max-w-[100vw] w-full mx-auto my-20"
  >
    <swiper-slide class="flex items-center justify-center h-[55vh] w-[65vw] lg:w-[40vw]" *ngFor="let slide of slides">
      <img class="h-full w-full object-cover rounded-[47px]" [src]="slide.img" alt="Coverflow Image" />
    </swiper-slide>
  </swiper-container>

   <!-- Custom Navigation Buttons --> 
   <div class="custom-navigation flex justify-center items-center gap-6">
    <button (click)="goPrev()" [disabled]="!swiperReady" class="custom-prev p-3.5 border-2 border-[#34394B] rounded-full">
      <img class="size-8" src="../../../../assets/images/grad-left-arrow.svg" alt="Prev" />
    </button>
    <button (click)="goNext()"  [disabled]="!swiperReady" class="custom-next p-3.5 border-2 border-[#34394B] rounded-full">
      <img class="size-8" src="../../../../assets/images/grad-right-arrow.svg" alt="Next" />
    </button>
  </div>
</div>
