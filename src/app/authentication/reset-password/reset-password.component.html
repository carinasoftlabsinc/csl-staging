<div class="auth-container">
    <div class="row auth-main">

      <div class="col-md-12 auth-form-section">
        <div class="form-section">
          <mat-card class="custom-card mat-elevation-z4">
          <div class="auth-wrapper">
           
            <div class="logo-container">
              <img src="assets/images/pages/imgpsh_fullsize_anim.png" width="80" class="rounded-logo">
            </div>
            <p class="welcome-msg"> Welcome to Carina Softlabs </p>
      
                <form (submit)="onReset(resetform)" #resetform="ngForm" class="mb-10">
                <div class="row">
                    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                      <mat-form-field class="example-full-width" appearance="outline">
                        <mat-label>Password</mat-label>
                        <input matInput [type]="showPassword ? 'text' : 'password'" type="password" name="password" ngModel #password="ngModel" required>
                       
                        <mat-error *ngIf="password.invalid">Please enter a valid password.</mat-error>
                      <mat-icon matSuffix (click)="togglePasswordVisibility()" >{{showPassword ? "visibility" : "visibility_off"}}</mat-icon>
                      </mat-form-field>
                    </div>
                  </div>


                  <div class="row">
                    <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                      <mat-form-field class="example-full-width" appearance="outline">
                        <mat-label>Confirm Password</mat-label>
                        <input matInput [type]="showConfirmPassword ? 'text' : 'password'" type="password" name="passwordConfirm" ngModel #passwordConfirm="ngModel" required />
             
                        <mat-error *ngIf="passwordConfirm.invalid">Please enter a valid confirm password.</mat-error>
                    <mat-icon matSuffix (click)="toggleConfirmPasswordVisibility()">{{ showConfirmPassword ? "visibility": "visibility_off"}}</mat-icon></mat-form-field>
                    </div>
                  </div>
                  <button mat-raised-button  matTooltip="reset password" color="primary"  style="width:100%; margin-top: 9px; height: 40px;"  type="submit" >Reset Password</button>
            </form>

            <p class="dark-secondary-text text-center">
                Do not want to the reset password , please login ?<br />
                <button mat-button  matTooltip="login" style="font-size:16px;"  color="primary" type="button" (click)="btnClick();">
                   login
                  <mat-icon inline=true>login</mat-icon>
                </button>
            </p>
  
          </div>
          </mat-card> 
        </div>
      </div>
  
    </div>
  </div>
