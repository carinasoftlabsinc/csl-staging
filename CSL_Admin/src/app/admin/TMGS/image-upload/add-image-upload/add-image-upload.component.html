<div class="addContainer">
  <div *ngIf="isLoading" class="spinner-container">
    <mat-spinner [diameter]="30"></mat-spinner>
  </div>
  <div *ngIf="!isLoading" class="contact-form">
    <div class="modalHeader">
      <div class="editRowModal">
        <div class="modalHeader clearfix">
          <div class="modal-about">
            <h2 *ngIf="mode === 'add'">Add Images</h2>
            <h2 *ngIf="mode === 'edit'">Edit Images</h2>
          </div>
        </div>
      </div>
      <button
        mat-icon-button
        type="button"
        (click)="dialogRef.close()"
        class="modal-close-button"
        aria-label="Close dialog"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div mat-dialog-content>
      <form class="register-form m-4" [formGroup]="form" (ngSubmit)="onSave()">
        <div class="row">
          <div class="col-6 mb-3">
            <mat-form-field
              appearance="outline"
              style="width: 250px; margin-left: 15px"
            >
              <mat-label>Select Folder</mat-label>
              <mat-select [(value)]="selectedFolder" required>
                <mat-option *ngFor="let folder of folderList" [value]="folder">
                  {{ folder | titlecase }}
                </mat-option>
              </mat-select>
            </mat-form-field>
          </div>

          <div class="col-12 mb-3">
            <div class="px-1 py-1 border-b">
              Images:
              <!-- <mat-icon
                    matTooltip="Upload Images"
                    color="primary"
                    style="font-size: 25px; cursor: pointer"
                    (click)="filePickerGallery.click()"
                    >photo_camera</mat-icon
                  > -->
              <!-- <mat-icon
                matTooltip="Upload Images"
                color="primary"
                [ngStyle]="{
                  fontSize: '25px',
                  cursor: 'pointer',
                  opacity:
                    galleryImagePreviews && galleryImagePreviews.length >= 10
                      ? 0.5
                      : 1
                }"
                (click)="
                  galleryImagePreviews &&
                    galleryImagePreviews.length < 10 &&
                    filePickerGallery?.click()
                "
              >
                photo_camera
              </mat-icon> -->
              <mat-icon
              matTooltip="Upload Images"
              color="primary"
              style="font-size: 25px; cursor: pointer;"
              [style.opacity]="galleryImagePreviews.length >= 10 ? 0.5 : 1"
              (click)="triggerFilePicker(filePickerGallery)"
            >
              photo_camera
            </mat-icon>
            
              <input
                type="file"
                #filePickerGallery
                (change)="onGalleryImagesPicked($event)"
                multiple
                style="display: none"
              />
            </div>
            <mat-hint
              style="font-size: 11px"
              class="px-1 py-1 border-b"
              *ngIf="form.get('image')?.hasError('required')"
            >
              At least one image is required
            </mat-hint>

            <div class="mt-2" *ngIf="galleryImagePreviews?.length">
              <div
                *ngFor="let image of galleryImagePreviews; let i = index"
                class="gallery-image-wrapper"
                style="display: inline-block; margin: 5px"
              >
                <img
                  [src]="image"
                  [alt]="'Gallery Image ' + (i + 1)"
                  class="image"
                  style="
                    width: 150px;
                    height: 150px;
                    object-fit: cover;
                    border-radius: 8px;
                  "
                />
                <button
                  mat-icon-button
                  type="button"
                  color="warn"
                  aria-label="Delete"
                  (click)="onRemoveGalleryImage(i)"
                  class="clear-button"
                >
                  <mat-icon matTooltip="Remove">cancel</mat-icon>
                </button>
              </div>
            </div>
          </div>

          <div class="col-12">
            <button
              mat-raised-button
              color="primary"
              class="btn-space"
              type="submit"
            >
              {{ mode === "add" ? "Submit" : "Update" }}
            </button>
            <button
              mat-raised-button
              color="warn"
              type="button"
              (click)="dialogRef.close()"
            >
              Close
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
