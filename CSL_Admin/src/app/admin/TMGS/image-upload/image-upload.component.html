<section class="content">

    <div class="content-block">
        <div class="block-header">
            <!-- breadcrumb -->
            <app-breadcrumb [title]="'Images Upload'" [items]="['Images Upload']" [active_item]="'Images Upload'">
            </app-breadcrumb>
        </div>
        <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
              <div class="card">
                <div class="materialTableHeader py-4">
                  <div class="left">
                    <ul class="header-buttons-left ms-0">
                      <li class="tbl-title">
                        <h2>Images Upload</h2>
                      </li>
                      <!-- <li class="tbl-search-box">
                        <label for="search-input"><i class="material-icons search-icon">search</i></label>
                        <input type="text" class="browser-default search-field" [(ngModel)]="filter"
                          (input)="onFilterChange(filter)" placeholder="Filter by  name">
                        <button mat-button color="warn" matTooltip="Reset" (click)="clearFilter()">
                          <mat-icon style="font-size:21px">restart_alt</mat-icon>
                        </button>
                      </li> -->
                      <li class="tbl-folder-dropdown">
                        <mat-form-field appearance="outline" style="width: 250px; margin-left: 15px;">
                          <mat-label>Select Folder</mat-label>
                          <mat-select [(value)]="selectedFolder" (selectionChange)="onFolderChange()">
                            <mat-option [value]="''">All</mat-option>
                            <mat-option *ngFor="let folder of folderList" [value]="folder">
                              {{ folder | titlecase }}
                            </mat-option>
                          </mat-select>
                        </mat-form-field>
                      </li>
                      
                      
                    </ul>
                  </div>
                  <div class="right">
                    <ul class="tbl-export-btn">
                      <li class="tbl-header-btn">
                        <div class="m-l-10">
                          <button mat-mini-fab color="primary" (click)="openAddDialog()" matTooltip="ADD">
                            <mat-icon class="col-white">add</mat-icon>
                          </button>
                        </div>
                      </li>
      
                    </ul>
                  </div>
                </div>
      
                <div class="body overflow-auto">
                  <mat-spinner [diameter]="30" *ngIf="isLoading"></mat-spinner>
                  <div class="responsive_table" *ngIf="data !== undefined && !isLoading">
      
                    <table mat-table [dataSource]="data" class="mat-cell">
                        <ng-container matColumnDef="preview">
                            <th mat-header-cell *matHeaderCellDef>Preview Image</th>
                            <td mat-cell *matCellDef="let item">
                              <img  [src]="imageBaseUrl + $safeNavigationMigration(item?.path)" alt="Image" width="100" height="100" style="object-fit: contain;" />
                            </td>
                          </ng-container>                          
                      <!-- <ng-container matColumnDef="filename">
                        <th mat-header-cell *matHeaderCellDef>filename</th>
                        <td mat-cell *matCellDef="let item">{{ item?.filename | titlecase }}</td>
                      </ng-container> -->
                      <ng-container matColumnDef="path">
                        <th mat-header-cell *matHeaderCellDef>path</th>
                        <td mat-cell *matCellDef="let item">{{ imageBaseUrl + item?.path  }}</td>
                      </ng-container>
                      <ng-container matColumnDef="uploadedAt">
                        <th mat-header-cell *matHeaderCellDef>Uploaded At</th>
                        <td mat-cell *matCellDef="let item">{{ $safeNavigationMigration(item?.uploadedAt) | date: 'medium' }}</td>
                      </ng-container>
                
            
                      
               
      
                      <!-- <ng-container matColumnDef="actions">
                        <th mat-header-cell class="psl-3 tbl-col-width-per-10" *matHeaderCellDef>
                          Actions
                        </th>
                        <td mat-cell *matCellDef="let row; let i = index" class="psl-3 tbl-col-width-per-10">
                          <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
                            <mat-icon>more_vert</mat-icon>
                          </button>
                          <mat-menu #menu="matMenu">
                            <button mat-menu-item (click)="openEditDialog(row)" matTooltip="Edit">
                              <mat-icon class="material-icons-two-tone align-middle msr-2">edit</mat-icon>
                              <span>Edit Request</span>
                            </button>
                            <button mat-menu-item (click)="Delete(row)" matTooltip="Delete">
                              <mat-icon class="material-icons-two-tone align-middle msr-2">delete</mat-icon>
                              <span>Delete Request</span>
                            </button>
                          </mat-menu>
                        </td>
                      </ng-container> -->
      
                      <!-- Table rows -->
                      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                      <tr mat-row *matRowDef="let item; columns: displayedColumns"></tr>
                    </table>
                  </div>
                  <div *ngIf="data.length === 0 && !isLoading" class="not-found-message">No results found.</div>
                </div>
                <mat-paginator [length]="totalCount" [pageSize]="limit" (page)="onPageChange($event)"></mat-paginator>
              </div>
      
            </div>
          </div>
    </div>
</section>
