<div mat-dialog-content cdkDropList (cdkDropListDropped)="drop($event)">
  <table mat-table [dataSource]="blogs" class="mat-elevation-z8">
    <!-- <ng-container matColumnDef="drag">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let blog">
        <mat-icon cdkDragHandle>drag_handle</mat-icon>
      </td>
    </ng-container> -->

      <!-- Drag Handle Column -->
    <ng-container matColumnDef="drag">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let row">
        <span cdkDragHandle style="cursor: move;">☰</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Title</th>
      <td mat-cell *matCellDef="let blog">{{ blog.title }}</td>
    </ng-container>

    <ng-container matColumnDef="orderIndex">
      <th mat-header-cell *matHeaderCellDef>Order</th>
      <td mat-cell *matCellDef="let blog">{{ blog.orderIndex }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns"
      cdkDrag
      [cdkDragData]="row"
      [attr.data-id]="row._id"
    ></tr>
  </table>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="close()">Cancel</button>
  <button mat-raised-button color="primary" (click)="saveOrder()">Save Order</button>
</div>
