<section class="content">
    <div class="content-block">
      <div class="block-header">
        <!-- breadcrumb -->
        <app-breadcrumb
          [title]="'Employee Pay Slips'"
          [items]="['Payroll']"
          [active_item]="'pay-slip'"
        >
        </app-breadcrumb>
      </div>
      <div class="row">
        <div class="col-md-12">
          <div class="tabbable-line">
            <div class="row">
              <div class="example-container">
                <form [formGroup]="form">
                  <div class="row">
                    <div class="col-lg-3 col-md-3 col-sm-12 col-xs-12">
                      <mat-form-field
                        class="example-full-width"
                        appearance="outline"
                      >
                        <mat-label>Select Year</mat-label>
                        <mat-select formControlName="y">
                          <mat-option
                            *ngFor="let yearOption of yearOptions"
                            [value]="yearOption"
                            >{{ yearOption }}</mat-option
                          >
                        </mat-select>
                      </mat-form-field>
                    </div>
                    <div class="col-lg-3 col-md-3 col-sm-12 col-xs-12">
                      <mat-form-field
                        class="example-full-width"
                        appearance="outline"
                      >
                        <mat-label>Select Month</mat-label>
                        <mat-select formControlName="m">
                          <mat-option
                            *ngFor="let monthOption of monthOptions"
                            [value]="monthOption.label"
                            >{{ monthOption.label }}</mat-option
                          >
                        </mat-select>
                      </mat-form-field>
                    </div>
                    <!-- <div class="col-3">
                      <mat-form-field
                        class="example-full-width"
                        appearance="outline"
                      >
                        <mat-label>Name</mat-label>
                        <mat-select formControlName="employeeName">
                          <mat-option
                            *ngFor="let employee of employees"
                            [value]="employee.name"
                          >
                            {{ employee.name | titlecase }}
                          </mat-option>
                        </mat-select>
                      </mat-form-field>
                    </div> -->
                    <div class="col-lg-3 col-md-3 col-sm-12 col-xs-12">
                      <button
                        mat-icon-button
                        color="primary"
                        matTooltip="Search"
                        (click)="onSearch()"
                      >
                        <mat-icon style="font-size: 21px">search</mat-icon>
                      </button>
                      <button
                        mat-icon-button
                        color="warn"
                        matTooltip="Reset"
                        (click)="onResetSearch()"
                      >
                        <mat-icon style="font-size: 21px">restart_alt</mat-icon>
                      </button>
                    </div>
                  </div>
                </form>
              </div>
              <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
                <div class="card">
                  <div class="materialTableHeader">
                    <div class="left">
                      <ul class="header-buttons-left ms-0">
                        <li class="tbl-title">
                          <h2>Pay Slip</h2>
                        </li>
                      </ul>
                    </div>
                    <!-- <div class="right">
                      <ul class="tbl-export-btn">
                        <li class="tbl-header-btn">
                          <div class="m-l-10" matTooltip="ADD">
                            <button routerLink='/admin/payroll/create-paySlip' mat-mini-fab color="primary">
                              <mat-icon class="col-white">add</mat-icon>
                            </button>
                          </div>
                        </li>
                      </ul>
                    </div> -->
                  </div>
                  <div class="body overflow-auto">
                    <mat-spinner [diameter]="30" *ngIf="isLoading"></mat-spinner>
                    <div
                      class="responsive_table"
                     *ngIf="paySlipData !== undefined && !isLoading"
                    >
                      <table
                        mat-table
                        #table
                        [dataSource]="paySlipData"
                        matSort
                        class="mat-cell"
                      >
                        <!-- ID Column -->
                        <ng-container matColumnDef="employeeName">
                          <mat-header-cell *matHeaderCellDef
                            >Name
                          </mat-header-cell>
                          <mat-cell *matCellDef="let row">
                            <span class="mobile-label">employeeName:</span
                            >{{ row.employeeName | titlecase }}</mat-cell
                          >
                        </ng-container>
  
                        <ng-container matColumnDef="salaryMonth">
                          <mat-header-cell *matHeaderCellDef
                            >Month
                          </mat-header-cell>
                          <mat-cell *matCellDef="let row">
                            <span class="mobile-label">salaryMonth:</span
                            >{{ row.salaryMonth | titlecase }}</mat-cell
                          >
                        </ng-container>
  
                        <ng-container matColumnDef="salaryYear">
                          <mat-header-cell *matHeaderCellDef
                            >Year
                          </mat-header-cell>
                          <mat-cell *matCellDef="let row">
                            <span class="mobile-label">salaryYear:</span
                            >{{ row.salaryYear }}</mat-cell
                          >
                        </ng-container>
  
                        <ng-container matColumnDef="payslip">
                          <mat-header-cell *matHeaderCellDef>Payslip</mat-header-cell>
                          <mat-cell *matCellDef="let row">
                            <span class="mobile-label">Payslip:</span>
                            <button mat-icon-button color="accent" [routerLink]="['/employee/payslip', row._id]" class="tbl-action-btn" (click)="$event.stopPropagation()"
                              >
                              <app-feather-icons [icon]="'download'" [class]="'col-green'" matTooltip="Download">
                              </app-feather-icons>
                            </button>
                          </mat-cell>
                        </ng-container>
  
                        <!-- <ng-container matColumnDef="actions">
                          <mat-header-cell
                            class="psl-3 tbl-col-width-per-10"
                            *matHeaderCellDef
                          >
                            Actions
                          </mat-header-cell>
                          <mat-cell
                            *matCellDef="let row; let i = index"
                            class="psl-3 tbl-col-width-per-10"
                          >
                            <button
                              mat-icon-button
                              [matMenuTriggerFor]="menu"
                              (click)="$event.stopPropagation()"
                            >
                              <mat-icon>more_vert</mat-icon>
                            </button>
                            <mat-menu #menu="matMenu">
                              <button
                              mat-menu-item
                              [routerLink]="['/admin/payroll/edit-paySlip/', row._id]"
                              matTooltip="Edit"
                            >
                              <mat-icon
                                class="material-icons-two-tone align-middle msr-2"
                                >edit</mat-icon
                              >
                              <span>Edit Request</span>
                            </button>
                              <button
                                mat-menu-item
                                (click)="Delete(row)"
                                matTooltip="Delete"
                              >
                                <mat-icon
                                  class="material-icons-two-tone align-middle msr-2"
                                  >delete</mat-icon
                                >
                                <span>Delete Request</span>
                              </button>
                            </mat-menu>
                          </mat-cell>
                        </ng-container> -->
                        <mat-header-row *matHeaderRowDef="displayedColumns">
                        </mat-header-row>
                        <mat-row
                          *matRowDef="let row; columns: displayedColumns"
                          [style.cursor]="'pointer'"
                          matRipple
                        >
                        </mat-row>
                      </table>
                    </div>
                    <div
                      *ngIf="paySlipData.length === 0 && !isLoading"
                      class="not-found-message"
                    >
                      No results found.
                    </div>
                  </div>
                  <mat-paginator
                    [length]="totalCount"
                    [pageSize]="limit"
                    [pageIndex]="currentPage - 1"
                    (page)="onPageChange($event)"
                  ></mat-paginator>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
