<div class="auth-container">
  <div class="row auth-main">
    <!-- <div class="col-sm-6 px-0 d-none d-sm-block">
      <div class="left-img" style="background-image: url(assets/images/pages/bg-03.png);">
      </div>
    </div> -->
    <div class="col-sm-12 auth-form-section">
      <div class="form-section">
        <mat-card class="custom-card mat-elevation-z4">
        <div class="auth-wrapper p-t-20 p-b-20 p-r-20 p-l-20">
          <div class="logo-container">
            <img src="assets/images/pages/imgpsh_fullsize_anim.png" width="80" class="rounded-logo">
          </div>
          <h2 class="welcome-msg"> Forget Password </h2>
          <!-- <p class="auth-signup-text text-muted">Let Us Help You</p> -->
          <form [formGroup]="authForm"  (ngSubmit)="onSubmit()" class="mb-10">
            <!-- <form class="validate-form" [formGroup]="authForm" (ngSubmit)="onSubmit()"> -->
            <div class="row">
              <div class="col-xl-12 col-lg-12 col-md-12 col-sm-12 mb-2">
                <span class="error-subheader2 p-t-20 p-b-15">
                  Enter your registered email address.
                </span>
                <mat-form-field class="example-full-width" appearance="outline">
                  <mat-label>Email</mat-label>                  
                  <input matInput formControlName="email" required>
                  <mat-icon class="material-icons-two-tone color-icon p-3" matSuffix>mail</mat-icon>
                  <mat-error *ngIf="authForm.get('email')?.hasError('required') || authForm.get('email')?.touched">
                    Please enter a valid email address
                  </mat-error>
                </mat-form-field>
              </div>
            </div>
            <div class="container-auth-form-btn mt-5">
              <button mat-raised-button color="primary" class="auth-form-btn" [disabled]="!authForm.valid "
                type="submit">
                Reset My Password
              </button>
            </div>
            <div class="w-full p-t-25 text-center">
              <div>
                <a routerLink="/signin" class="txt1">
                  Login?
                </a>
              </div>
            </div>
          </form>
        </div>
        </mat-card>
      </div>
    </div>

  </div>
</div>
