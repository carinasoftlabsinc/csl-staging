<div class="addContainer">
    <div *ngIf="isLoading" class="spinner-container">
      <mat-spinner [diameter]="30"></mat-spinner>
    </div>
    <div *ngIf="!isLoading" class="contact-form">
      <div class="modalHeader">
        <div class="editRowModal">
          <div class="modalHeader clearfix">
            <div class="modal-about">
              <h2 *ngIf="mode === 'add'">Add Partner</h2>
              <h2 *ngIf="mode === 'edit'">Edit Partner</h2>
            </div>
          </div>
        </div>
        <button
          mat-icon-button
          type="button"
          (click)="dialogRef.close()"
          class="modal-close-button"
          aria-label="Close dialog"
        >
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <div mat-dialog-content>
        <form class="register-form m-4" [formGroup]="form" (ngSubmit)="onSave()">
          <div class="row">
            <div class="col-12 mb-3">
              <mat-form-field class="example-full-width" appearance="outline">
                <mat-label>Url</mat-label>
                <input matInput formControlName="url" required />
                <mat-error *ngIf="form.get('url')?.hasError('required')">
                    url is required
                </mat-error>
              </mat-form-field>
            </div>


            <div class="col-12 mb-3">
                <div class="px-1 py-1 border-b">
                   Image:
                  <mat-icon
                    matTooltip="logo"
                    color="primary"
                    style="font-size: 25px; cursor: pointer"
                    (click)="filePickerCardBg.click()"
                    >photo_camera</mat-icon
                  >
                  <input
                    type="file"
                    #filePickerCardBg
                    (change)="onImagePicked2($event)"
                  />
                </div>
                <mat-hint
                  style="font-size: 11px"
                  class="px-1 py-1 border-b"
                  *ngIf="form.get('image')?.hasError('required')"
                >
                  Image is required
                </mat-hint>
    
                <div
                  class="image-container mt-2"
                  *ngIf="
                  blogImagePreview &&   
                    form.get('image')?.valid
                  "
                >
                  <img [src]="blogImagePreview" [alt]="" class="image" />
                  <button
                    mat-icon-button
                    color="warn"
                    aria-label="Delete"
                    (click)="onClearImage2()"
                    class="clear-button"
                  >
                    <mat-icon matTooltip="clear">cancel</mat-icon>
                  </button>
                </div>
              </div>

           

             
           
  
  
            <div class="col-12">
              <button
                mat-raised-button
                color="primary"
                class="btn-space"
                type="submit"
              >
                {{ mode === "add" ? "Submit" : "Update" }}
              </button>
              <button
                mat-raised-button
                color="warn"
                type="button"
                (click)="dialogRef.close()"
              >
                Close
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
