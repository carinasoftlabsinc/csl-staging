<section class="content">

    <div class="content-block">
        <div class="block-header">
            <!-- breadcrumb -->
            <app-breadcrumb [title]="'Ad Management'" [items]="['Ad Management']" [active_item]="'Ad Management'">
            </app-breadcrumb>
        </div>
        <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
              <div class="card">
                <div class="materialTableHeader">
                  <div class="left">
                    <ul class="header-buttons-left ms-0">
                      <li class="tbl-title">
                        <h2>Ad Management</h2>
                      </li>
                      <li class="tbl-search-box">
                        <label for="search-input"><i class="material-icons search-icon">search</i></label>
                        <input type="text" class="browser-default search-field" [(ngModel)]="filter"
                          (input)="onFilterChange(filter)" placeholder="Filter by  name">
                        <button mat-button color="warn" matTooltip="Reset" (click)="clearFilter()">
                          <mat-icon style="font-size:21px">restart_alt</mat-icon>
                        </button>
                      </li>
      
                    </ul>
                  </div>
                  <div class="right">
                    <ul class="tbl-export-btn">
                      <li class="tbl-header-btn">
                        <div class="m-l-10">
                          <button mat-mini-fab color="primary" (click)="openAddDialog()" matTooltip="ADD">
                            <mat-icon class="col-white">add</mat-icon>
                          </button>
                        </div>
                      </li>
      
                    </ul>
                  </div>
                </div>
      
                <div class="body overflow-auto">
                  <mat-spinner [diameter]="30" *ngIf="isLoading"></mat-spinner>
                  <div class="responsive_table" *ngIf="data !== undefined && !isLoading">
      
                    <table mat-table [dataSource]="data" class="mat-cell">
                      <ng-container matColumnDef="name">
                        <th mat-header-cell *matHeaderCellDef>Name</th>
                        <td mat-cell *matCellDef="let item">{{ $safeNavigationMigration(item?.name) | titlecase}}</td>
                      </ng-container>
                      <ng-container matColumnDef="orientation">
                        <th mat-header-cell *matHeaderCellDef>Orientation</th>
                        <td mat-cell *matCellDef="let item">{{ $safeNavigationMigration(item?.orientation) | titlecase }}</td>
                      </ng-container>
                      <ng-container matColumnDef="duration">
                        <th mat-header-cell *matHeaderCellDef>Duration (in sec)</th>
                        <td mat-cell *matCellDef="let item">{{ item?.duration }}</td>
                      </ng-container>
                      <ng-container matColumnDef="playCount">
                        <th mat-header-cell *matHeaderCellDef>Play Count</th>
                        <td mat-cell *matCellDef="let item">{{ item?.playCount }}</td>
                      </ng-container>
                   
                      <!-- <ng-container matColumnDef="applicationDeadline">
                        <th mat-header-cell *matHeaderCellDef>Application Deadline</th>
                        <td mat-cell *matCellDef="let item">{{ item?.applicationDeadline | date: 'MMM d, y' }}</td>
                      </ng-container> -->
                      <ng-container matColumnDef="active">
                        <th mat-header-cell *matHeaderCellDef>Active</th>
                        <td mat-cell *matCellDef="let item">{{ item?.active ? 'Yes' : 'No' }}</td>

                      </ng-container>
                      
               
      
                      <ng-container matColumnDef="actions">
                        <th mat-header-cell class="psl-3 tbl-col-width-per-10" *matHeaderCellDef>
                          Actions
                        </th>
                        <td mat-cell *matCellDef="let row; let i = index" class="psl-3 tbl-col-width-per-10">
                          <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
                            <mat-icon>more_vert</mat-icon>
                          </button>
                          <mat-menu #menu="matMenu">
                            <button mat-menu-item (click)="openEditDialog(row)" matTooltip="Edit">
                              <mat-icon class="material-icons-two-tone align-middle msr-2">edit</mat-icon>
                              <span>Edit Request</span>
                            </button>
                            <button mat-menu-item (click)="Delete(row)" matTooltip="Delete">
                              <mat-icon class="material-icons-two-tone align-middle msr-2">delete</mat-icon>
                              <span>Delete Request</span>
                            </button>

                            <button mat-menu-item (click)="toggleAdStatus(row)" [matTooltip]="row.active ? 'Deactivate' : 'Activate'">
                                <mat-icon class="material-icons-two-tone align-middle msr-2">
                                  {{ row.active ? 'block' : 'check_circle' }}
                                </mat-icon>
                                <span>{{ row.active ? 'Deactivate' : 'Activate' }}</span>
                              </button>
                          </mat-menu>
                        </td>
                      </ng-container>
      
                      <!-- Table rows -->
                      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                      <tr mat-row *matRowDef="let item; columns: displayedColumns"></tr>
                    </table>
                  </div>
                  <div *ngIf="data.length === 0 && !isLoading" class="not-found-message">No results found.</div>
                </div>
                <mat-paginator [length]="totalCount" [pageSize]="limit" (page)="onPageChange($event)"></mat-paginator>
              </div>
      
            </div>
          </div>
    </div>
</section>
