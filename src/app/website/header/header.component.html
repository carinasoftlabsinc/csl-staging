<!-- h-auto, bg-transparent and the two inherits undo a legacy global `header` rule (200px tall, grey, centred) from the old admin template -->
<header class="relative flex flex-wrap items-center justify-between p-4 !px-7 md:!px-10 2xl:!px-24 xl:!px-14 h-auto bg-transparent [line-height:inherit] [text-align:inherit]">
  <a routerLink="/" class="flex items-center text-white mb-1 md:mb-0 flex-center">
    <img
      [src]="isWhiteBackground() ? 'assets/images/csl-logo-white.svg' : 'assets/CSL-logo.svg'"
      class="w-48 2xl:w-80"
      alt="Carina Softlabs"
      width="305"
      height="56"
      fetchpriority="high"
    />
  </a>

  <a
    href="https://calendar.app.google/mezjQ2cpZyzbixNv6"
    target="_blank"
    rel="noopener noreferrer"
    class="hidden md:block px-4 py-2 md:mr-12 xl:mr-14 rounded-full border !border-[#34394B] font-quickSand 2xl:!text-[18px] xl:text-[14px] lg:!px-6 lg:!py-2 xl:!px-6 xl:!py-2.5 2xl:!px-8 2xl:!py-3"
    [class]="isWhiteBackground() ? '!text-black visited:!text-black hover:!text-black' : '!text-white visited:!text-white hover:!text-white'"
  >
    Schedule a call
  </a>

  <button
    type="button"
    class="hamburger right-7 md:right-10 xl:right-14 2xl:right-24"
    [class.is-open]="isOpen()"
    aria-label="Menu"
    aria-controls="menu"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
  >
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path
        class="line line-top-bottom"
        d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"
      ></path>
      <path class="line" d="M7 16 27 16"></path>
    </svg>
  </button>
</header>

<nav
  id="menu"
  aria-label="Main"
  class="flex items-center justify-center md:gap-24 gap-10 mx-auto lg:!py-4 2xl:!py-7 bg-[#0B0C10] nvv"
  [class.open]="isOpen()"
>
  <ul class="flex flex-col lg:flex-row font-quickSand gap-y-11">
    @for (item of menu; track item.label; let i = $index; let first = $first) {
      <li class="relative group">
        @if (item.children; as children) {
          <button
            type="button"
            class="nav-trigger w-full font-quickSand hover:text-gray-400 text-white !text-lg md:!text-lg xl:!text-[1.12rem] sepp head-arrow"
            [attr.aria-expanded]="openDropdown() === i"
            (click)="toggleDropdown(i)"
            >{{ item.label }}&ngsp;</button
          >
          <div class="absolute hidden pt-2 group-hover:block data-[open=true]:block z-10" [class]="item.dropdownClass" [attr.data-open]="openDropdown() === i">
            <div class="w-48 py-2 bg-[#0B0C10] shadow-lg">
              @for (child of children; track child.route) {
                <a
                  [routerLink]="child.route"
                  class="block px-4 py-2 hover:bg-gray-700 text-white !text-lg md:!text-lg xl:!text-[1.12rem]"
                  >{{ child.label }}</a
                >
              }
            </div>
          </div>
        } @else {
          <a
            [routerLink]="item.route"
            class="hover:text-gray-400 text-white !text-lg md:!text-lg xl:!text-[1.12rem]"
            [class]="first ? 'lg:py-[15px] lg:pr-[25px]' : 'sepp'"
            >{{ item.label }}</a
          >
        }
      </li>
    }
  </ul>
</nav>
